<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🏓 Pong</h1>
      <p class="tagline">Outplay the AI — first to 11 wins.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">You</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">AI</span><span class="stat-value" id="ai">0</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="640" height="480"></canvas>
      <p class="message" id="message">Press Start to serve.</p>
    </div>

    <footer class="controls">
      <button id="start" class="btn">Start Game</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
